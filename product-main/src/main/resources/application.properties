spring.application.name=product
server.port=${SERVER_PORT:8080}

# Banco de dados (cada microsservico possui o seu proprio banco)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.docker.compose.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.jakarta.persistence.create-database-schemas=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true